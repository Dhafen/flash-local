# The gates a maintainer runs locally before a release, on GitHub's hosted
# Apple-silicon runner. Model-dependent tests are environment-gated and skip
# themselves here; there is no external drive on a hosted runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `shell: bash` gives every step `-o pipefail`, so a failing xcodebuild behind
# `| tail` fails the step instead of hiding under the last twenty lines.
defaults:
  run:
    shell: bash

# Non-interactive Xcode must be told to trust build plugins and macros
# (EmbedGitRevision, and mlx-swift's), or the build stops at validation.
env:
  XCODEBUILD_FLAGS: -skipPackagePluginValidation -skipMacroValidation

jobs:
  build-and-test:
    name: streaming tests · app tests · package tests · iOS build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Select pinned Xcode 26.2
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Apps/Minirun/Minirun.xcodeproj -scheme Minirun-macOS $XCODEBUILD_FLAGS

      - name: GGUF parser, state and storage correctness
        run: |
          python3 scripts/fetch_ream_metadata.py
          python3 scripts/make_engram_test_fixture.py
          python3 scripts/make_qwen4exp_test_model.py
          export GGUF_HEADER_FIXTURE="$GITHUB_WORKSPACE/.test-fixtures/ream.header"
          export TEST_RUNNER_GGUF_HEADER_FIXTURE="$GGUF_HEADER_FIXTURE"
          xcodebuild test -scheme minirun-Package $XCODEBUILD_FLAGS -destination 'platform=macOS' \
            -only-testing:GGUFCoreTests -only-testing:ModelAdaptersTests -only-testing:MLXBridgeTests \
            -only-testing:StorageCoreTests -only-testing:iOSBenchTests \
            -only-testing:MinirunKitTests/LocalModelStorageTests \
            -only-testing:MinirunKitTests/VerifiedGGUFArtifactTests \
            -skip-testing:ModelAdaptersTests/Qwen4ExpDecoderParityTests \
            -resultBundlePath streaming-tests.xcresult 2>&1 | tee streaming-tests.log | tail -60
          if grep -E 'PublishedGGUFTests.*skipped' streaming-tests.log; then exit 1; fi
          if grep -E 'PublishedQwen4ExpLayoutTests.*skipped' streaming-tests.log; then exit 1; fi

      - name: Synthetic full-graph logits against pinned CPU llama.cpp
        run: |
          python3 scripts/run_synthetic_reference.py
          export GGUF_HEADER_FIXTURE="$GITHUB_WORKSPACE/.test-fixtures/ream.header"
          export TEST_RUNNER_GGUF_HEADER_FIXTURE="$GGUF_HEADER_FIXTURE"
          xcodebuild test -scheme minirun-Package $XCODEBUILD_FLAGS -destination 'platform=macOS' \
            -only-testing:ModelAdaptersTests/Qwen4ExpDecoderParityTests \
            -resultBundlePath parity-tests.xcresult 2>&1 | tee parity-tests.log | tail -80
          if grep -E 'Qwen4ExpDecoderParityTests.*skipped' parity-tests.log; then exit 1; fi

      - name: App tests (macOS)
        run: |
          set -o pipefail
          xcodebuild test -project Apps/Minirun/Minirun.xcodeproj $XCODEBUILD_FLAGS \
            -scheme Minirun-macOS -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee app-tests.log | tail -40

      - name: Package tests (MinirunKit)
        run: |
          set -o pipefail
          xcodebuild test -scheme minirun-Package $XCODEBUILD_FLAGS -destination 'platform=macOS' \
            -only-testing:MinirunKitTests 2>&1 | tee package-tests.log | tail -40

      - name: Failing tests, if any
        if: failure()
        run: |
          grep -hE "error: -\[|' failed \(|Executed [0-9]+ tests" app-tests.log package-tests.log 2>/dev/null | sed 's/^.*Test Case/Test Case/' | sort -u | head -80 || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            app-tests.log
            package-tests.log
            streaming-tests.log
            streaming-tests.xcresult
            parity-tests.log
            parity-tests.xcresult
            .work/reference-build.log
            .test-fixtures/llama-reference-logits.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Build the iOS app (Simulator)
        run: |
          xcodebuild build -project Apps/Minirun/Minirun.xcodeproj $XCODEBUILD_FLAGS \
            -scheme Minirun-iOS -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
