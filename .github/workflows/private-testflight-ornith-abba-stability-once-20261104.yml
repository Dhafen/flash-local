name: Deliver render-corrected Ornith private TestFlight once
on:
  push:
    branches: [release/ornith-render-stability-private-testflight-20261105]
    paths: [.github/workflows/private-testflight-ornith-abba-stability-once-20261104.yml]

permissions:
  contents: read

concurrency:
  group: flash-local-ornith-abba-private-delivery-20261104
  cancel-in-progress: false

jobs:
  launch:
    if: github.repository == 'Dhafen/flash-local' && github.ref == 'refs/heads/release/ornith-render-stability-private-testflight-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the failed attempt and dispatch the existing private delivery gates once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ff755c31f318f66e07830a15685d3ea81daff3f5
          PREVIOUS_SOURCE: a50f027388bdf7973525d6b63a31032ed2ba7242
          VALIDATED_RUN: '42029394075'
          PREVIOUS_RUN: '41858653979'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/private-testflight-ornith-abba-stability-once-20261104.yml'
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN" --jq '[.head_sha, .status, .conclusion, .run_attempt] | @tsv')
          read -r previous_sha status conclusion attempt <<< "$previous"
          test "$previous_sha" = "$PREVIOUS_SOURCE"
          test "$status" = completed
          test "$conclusion" = failure
          test "$attempt" = 5
          validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN" --jq '[.head_sha, .status, .conclusion] | @tsv')
          read -r validated_sha validated_status validated_conclusion <<< "$validated"
          test "$validated_sha" = "$EXPECTED_PARENT"
          test "$validated_status" = completed
          test "$validated_conclusion" = success
          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/18" --jq .head.sha)
          test "$pr_head" = "$EXPECTED_PARENT"
          for run_status in queued in_progress waiting pending requested; do
            active=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f status="$run_status" --jq .total_count)
            test "$active" = 0 || { echo "Another CI run is active; refusing competing delivery."; exit 1; }
          done
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          existing=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" -f event=workflow_dispatch --jq .total_count)
          if [[ "$existing" != 0 ]]; then
            echo 'A delivery already exists for this exact release commit.'
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f use_macos15=false -f ornith_les=true -f flint=false -f release_archive=true \
            -f probe_automatic_signing=true -f provisioning_only=false -f check_delivery_tools=false \
            -f upload_private_testflight=true -f regenerate_project_only=false
