# One-time, source-pinned delivery launch. This helper lives only on a
# separate release branch; PR #12 source files stay unchanged.
# It may dispatch the existing CI's own-tester-only TestFlight flow exactly
# once, and only if its immediate parent has the verified successful CI run.
name: One-time Flash Local private TestFlight launch
on:
  push:
    branches:
      - release/community-gguf-private-testflight-20261103
    paths:
      - .github/workflows/private-testflight-once-20261103.yml

permissions:
  contents: read

jobs:
  dispatch-verified-private-build:
    if: ${{ github.repository == 'Dhafen/flash-local' && github.ref == 'refs/heads/release/community-gguf-private-testflight-20261103' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove tested source and sole workflow change before requesting delivery
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: 670dc58996c51e8d67be0c8910394cfe286d6e89
          TESTED_RUN: '41553747946'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/private-testflight-once-20261103.yml"
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = "Dhafen/flash-local"
          target = "release/community-gguf-private-testflight-20261103"
          original = os.environ["EXPECTED_PARENT"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "flash-local-one-time-release"
          }
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as response:
                  return json.load(response)
          tested = get("https://api.github.com/repos/" + repo + "/actions/runs/" + os.environ["TESTED_RUN"])
          if (tested.get("head_sha"), tested.get("conclusion"), tested.get("event")) != (original, "success", "pull_request"):
              raise RuntimeError("The expected PR source has not passed the pinned CI verification")
          print("Verified previous green CI run:", tested["id"])
          # This is the project's existing authenticated private, own-tester
          # workflow. It fails closed if Apple configuration/signing is absent,
          # and it cannot upload without verified device archive and export.
          payload = {
              "ref": target,
              "inputs": {
                  "use_macos15": "false",
                  "ornith_les": "false",
                  "flint": "false",
                  "release_archive": "true",
                  "probe_automatic_signing": "true",
                  "provisioning_only": "false",
                  "check_delivery_tools": "false",
                  "upload_private_testflight": "true",
                  "regenerate_project_only": "false"
              }
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repo + "/actions/workflows/ci.yml/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              if response.status != 204:
                  raise RuntimeError("GitHub did not accept the delivery dispatch")
          print("GitHub accepted the private TestFlight delivery dispatch on the release branch.")
          PY
