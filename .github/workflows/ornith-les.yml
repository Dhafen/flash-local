name: Ornith LES isolated validation
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/ornith-les-backend]
    paths:
      - 'Experiments/OrnithLES/**'
      - 'scripts/*ornith_les*'
      - '.github/workflows/ornith-les.yml'
  pull_request:
    paths:
      - 'Experiments/OrnithLES/**'
      - 'scripts/*ornith_les*'
      - '.github/workflows/ornith-les.yml'
permissions:
  contents: read
concurrency:
  group: ornith-les-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  native-controls:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      ORNITH_LES_CPU_CONTROL: '1'
      TEST_RUNNER_ORNITH_LES_CPU_CONTROL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select pinned Apple host
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build isolated Mac runtime for fast numerical controls
        run: python3 scripts/build_ornith_les.py --mac-only
      - name: Real checkpoint tensor shapes without trained weights
        run: |
          python3 scripts/fetch_ornith_metadata.py
          .work/ornith-les-macos/bin/ornith-les-header-control \
            .test-fixtures/ornith.header .work/les-real-header-only .work/les-real-header.json \
            > .work/les-real-header.log 2>&1
          tail -5 .work/les-real-header.log
          grep 'ORNITH_REAL_HEADER.*metadataOnly=true.*inferenceExecuted=false' .work/les-real-header.log
      - name: Generate small untrained Ornith fixture
        run: python3 scripts/make_qwen4exp_test_model.py --ornith
      - name: Compare resident, streamed and lookahead execution with the CPU oracle
        run: |
          .work/ornith-les-macos/bin/ornith-les-control \
            .test-fixtures/synthetic-ornith.gguf .work/les-control-f32 .work/les-control-f32.json \
            > .work/les-controls.log 2>&1
          cat .work/les-controls.log | tail -8
          grep 'ORNITH_LES_CONTROL.*routing=true.*syntheticOnly=true' .work/les-controls.log
      - name: Mixed Q4_K/Q6_K expert controls
        run: |
          python3 scripts/make_qwen4exp_test_model.py --ornith --mixed
          .work/ornith-les-macos/bin/ornith-les-mixed-fixture \
            .test-fixtures/synthetic-ornith-mixed-source.gguf .test-fixtures/synthetic-ornith-mixed.gguf --ornith
          .work/ornith-les-macos/bin/ornith-les-control \
            .test-fixtures/synthetic-ornith-mixed.gguf .work/les-control-mixed .work/les-control-mixed.json \
            > .work/les-mixed-controls.log 2>&1
          tail -8 .work/les-mixed-controls.log
      - name: Real routing cardinality without trained weights
        run: |
          python3 scripts/make_qwen4exp_test_model.py --ornith --wide-experts
          .work/ornith-les-macos/bin/ornith-les-control \
            .test-fixtures/synthetic-ornith-top8.gguf .work/les-control-top8 .work/les-control-top8.json \
            > .work/les-top8-controls.log 2>&1
          tail -8 .work/les-top8-controls.log
      - name: Compare both complete synthetic graphs with the existing pinned CPU reference
        run: python3 scripts/run_ornith_les_reference.py
      - name: Build isolated original-math LES runtime (Mac, iPhone, Simulator)
        run: python3 scripts/build_ornith_les.py
      - name: Build unchanged tokenizer for the Swift adapter checks
        run: python3 scripts/build_tokenizer_xcframework.py
      - name: Swift memory, comparison and aggregate export controls
        env:
          FLASH_LOCAL_ENABLE_LES: '1'
        run: |
          export ORNITH_LES_FIXTURE_ROOT="$PWD/.test-fixtures"
          export TEST_RUNNER_ORNITH_LES_FIXTURE_ROOT="$ORNITH_LES_FIXTURE_ROOT"
          xcodebuild test -scheme minirun-Package -destination 'platform=macOS' \
            -only-testing:OrnithLESTests -skipPackagePluginValidation -skipMacroValidation \
            > .work/les-swift-tests.log 2>&1
          tail -12 .work/les-swift-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ornith-les-controls
          include-hidden-files: true
          path: |
            .work/ornith-les-runtime/build.log
            .work/ornith-les-runtime/build-manifest.json
            .work/les-controls.log
            .work/les-control-f32.json
            .work/les-mixed-controls.log
            .work/les-control-mixed.json
            .work/les-top8-controls.log
            .work/les-control-top8.json
            .work/les-reference-check.json
            .work/les-reference.log
            .work/les-swift-tests.log
            .work/les-real-header.json
            .work/les-real-header.log
          retention-days: 7
      - name: Export source-bound LES framework for full app validation
        uses: actions/upload-artifact@v4
        with:
          name: ornith-les-runtime
          include-hidden-files: true
          path: |
            .work/ornith-les-runtime/FlashOrnithLES.xcframework
            .work/ornith-les-runtime/build-manifest.json
          retention-days: 7
