name: Ornith LES isolated validation
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/ornith-les-backend]
    paths:
      - 'Experiments/OrnithLES/**'
      - 'scripts/*ornith_les*'
      - '.github/workflows/ornith-les.yml'
  pull_request:
    paths:
      - 'Experiments/OrnithLES/**'
      - 'scripts/*ornith_les*'
      - '.github/workflows/ornith-les.yml'
permissions:
  contents: read
concurrency:
  group: ornith-les-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  native-controls:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      ORNITH_LES_CPU_CONTROL: '1'
      TEST_RUNNER_ORNITH_LES_CPU_CONTROL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select pinned Apple host
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build isolated Mac runtime for fast numerical controls
        run: python3 scripts/build_ornith_les.py --mac-only
      - name: Actual Metal weight decoding and available projections (untrained only)
        run: |
          .work/ornith-les-macos/bin/ornith-les-metal-control .work/les-metal-projections.json \
            > .work/les-metal-projections.log 2>&1
          tail -8 .work/les-metal-projections.log
          grep -E 'ORNITH_METAL_HOST_CONTROLS completed=true dequantizationPassed=true projections=(passed|unavailable) syntheticOnly=true physicalPhone=false' .work/les-metal-projections.log
      - name: VM page buffers release their touched mappings
        run: |
          .work/ornith-les-macos/bin/ornith-les-allocation-control > .work/les-allocation-controls.log 2>&1
          cat .work/les-allocation-controls.log
          grep 'ORNITH_VM_ALLOCATION pageAligned=true touchedMappingsReleased=true cycles=9 modelLoaded=false physicalPhone=false' .work/les-allocation-controls.log
      - name: Real checkpoint tensor shapes without trained weights
        run: |
          python3 scripts/fetch_ornith_metadata.py
          .work/ornith-les-macos/bin/ornith-les-header-control \
            .test-fixtures/ornith.header .work/les-real-header-only .work/les-real-header.json \
            > .work/les-real-header.log 2>&1
          tail -5 .work/les-real-header.log
          grep 'ORNITH_REAL_HEADER.*metadataOnly=true.*inferenceExecuted=false' .work/les-real-header.log
      - name: Generate small untrained Ornith fixture
        run: python3 scripts/make_qwen4exp_test_model.py --ornith
      - name: Compare resident, streamed and lookahead execution with the CPU oracle
        run: |
          .work/ornith-les-macos/bin/ornith-les-control \
            .test-fixtures/synthetic-ornith.gguf .work/les-control-f32 .work/les-control-f32.json \
            > .work/les-controls.log 2>&1
          cat .work/les-controls.log | tail -8
          grep 'ORNITH_LES_CONTROL.*routing=true.*syntheticOnly=true' .work/les-controls.log
          grep 'ORNITH_ROUTING_TRACE paddedRows=true batchOrderIndependent=true changedExpertDetected=true invalidInputAtomic=true' .work/les-controls.log
          grep 'ORNITH_EXPERT_SETS exactPositionLayer=true rankPermutationDistinguished=true changedExpertDetected=true duplicateRejected=true atomic=true' .work/les-controls.log
          grep 'ORNITH_BATCH_CONTROL prefixCases=5 steps=5 .*canonicalRouting=true reset=true syntheticOnly=true' .work/les-controls.log
      - name: Mixed Q4_K/Q6_K expert controls
        run: |
          python3 scripts/make_qwen4exp_test_model.py --ornith --mixed
          .work/ornith-les-macos/bin/ornith-les-mixed-fixture \
            .test-fixtures/synthetic-ornith-mixed-source.gguf .test-fixtures/synthetic-ornith-mixed.gguf --ornith
          .work/ornith-les-macos/bin/ornith-les-control \
            .test-fixtures/synthetic-ornith-mixed.gguf .work/les-control-mixed .work/les-control-mixed.json \
            > .work/les-mixed-controls.log 2>&1
          tail -8 .work/les-mixed-controls.log
          grep 'ORNITH_ROUTING_TRACE paddedRows=true batchOrderIndependent=true changedExpertDetected=true invalidInputAtomic=true' .work/les-mixed-controls.log
          grep 'ORNITH_EXPERT_SETS exactPositionLayer=true rankPermutationDistinguished=true changedExpertDetected=true duplicateRejected=true atomic=true' .work/les-mixed-controls.log
          grep 'ORNITH_BATCH_CONTROL prefixCases=5 steps=5 .*canonicalRouting=true reset=true syntheticOnly=true' .work/les-mixed-controls.log
      - name: Real routing cardinality without trained weights
        run: |
          python3 scripts/make_qwen4exp_test_model.py --ornith --wide-experts
          .work/ornith-les-macos/bin/ornith-les-control \
            .test-fixtures/synthetic-ornith-top8.gguf .work/les-control-top8 .work/les-control-top8.json \
            > .work/les-top8-controls.log 2>&1
          tail -8 .work/les-top8-controls.log
          grep 'ORNITH_ROUTING_TRACE paddedRows=true batchOrderIndependent=true changedExpertDetected=true invalidInputAtomic=true' .work/les-top8-controls.log
          grep 'ORNITH_EXPERT_SETS exactPositionLayer=true rankPermutationDistinguished=true changedExpertDetected=true duplicateRejected=true atomic=true' .work/les-top8-controls.log
          grep 'ORNITH_BATCH_CONTROL prefixCases=11 steps=128 .*canonicalRouting=true reset=true syntheticOnly=true' .work/les-top8-controls.log
          for log in .work/les-controls.log .work/les-mixed-controls.log .work/les-top8-controls.log; do
            grep 'ORNITH_LAYER_CONTROL mainLayers=4 complete=true rawDeltaNetDistinct=true finalLayerMatched=true ' "$log"
            grep 'ORNITH_CALLBACK_FREE variants=6 serialAndBatch=true fullVocabulary=true reset=true noObservers=true ' "$log"
          done
      - name: Compare persistent I/O with the unchanged legacy schedule
        run: |
          set -o pipefail
          for readers in 1 4 8; do
            for kind in f32 mixed top8; do
              input=.test-fixtures/synthetic-ornith.gguf
              if [ "$kind" = mixed ]; then input=.test-fixtures/synthetic-ornith-mixed.gguf; fi
              if [ "$kind" = top8 ]; then input=.test-fixtures/synthetic-ornith-top8.gguf; fi
              ORNITH_LES_PERSISTENT_IO=1 ORNITH_LES_IO_READERS="$readers" \
                .work/ornith-les-macos/bin/ornith-les-control "$input" \
                ".work/les-pooled-$kind-$readers" ".work/les-pooled-$kind-$readers.json" \
                > ".work/les-pooled-$kind-$readers.log" 2>&1
              tail -2 ".work/les-pooled-$kind-$readers.log"
              grep 'ORNITH_POOLED_NATIVE comparisons=.*logitsBitwise=true routing=true ownerTeardown=true syntheticOnly=true physicalPhone=false' ".work/les-pooled-$kind-$readers.log"
            done
          done
      - name: Compare both complete synthetic graphs with the existing pinned CPU reference
        run: |
          python3 scripts/run_ornith_les_reference.py
          grep 'ORNITH_PROJECTION_PROBE matchedInput=true cpuRoundingDistinguished=true changedResultDetected=true syntheticOnly=true gpuExecuted=false' .work/les-reference.log
          test "$(grep -c 'ORNITH_CHECKPOINT_REFERENCE wrapperTrace=true exactLogits=true steps=5 ' .work/les-reference.log)" = 2
          test "$(grep -c 'ORNITH_DEQUANTIZED_OPERATORS types=8 denseAndExperts=true stridedTopK=true originalF32Input=true invalidExpertAtomic=true governor=true boundedScratch=true syntheticOnly=true' .work/les-reference.log)" = 3
          test "$(grep -c 'ORNITH_DEQUANTIZED_REFERENCE independentF32Graph=true originalCPUUnchanged=true steps=5 fullVocabulary=true ' .work/les-reference.log)" = 3
          test "$(grep -c 'ORNITH_REFERENCE_EXPERT_SETS complete=true originalWeights=true syntheticOnly=true' .work/les-reference.log)" = 3
      - name: Both thinking modes against the pinned Ornith template
        run: |
          python3 scripts/make_tokenizer_reference_fixture.py --ornith
          cmake --build .work/reference-build --config Release --target flash-local-tokenizer-reference --parallel 3
          .work/reference-build/flash-local-tokenizer-reference \
            .test-fixtures/ornith-tokenizer/qwen35-vocabulary-only.gguf \
            .test-fixtures/ornith-tokenizer/qwen35-tokenizer-corpus.bin \
            .test-fixtures/ornith-tokenizer/qwen35-tokenizer-reference.json \
            .test-fixtures/ornith-tokenizer/qwen35-tokenizer-corpus.json \
            > .work/ornith-thinking-tokenizer.log 2>&1
          tail -5 .work/ornith-thinking-tokenizer.log
      - name: Build isolated original-math LES runtime (Mac, iPhone, Simulator)
        run: python3 scripts/build_ornith_les.py
      - name: Build canonical tokenizer for the Swift adapter checks
        run: python3 scripts/build_tokenizer_xcframework.py
      - name: Swift memory, comparison and aggregate export controls
        env:
          FLASH_LOCAL_ENABLE_LES: '1'
        run: |
          export ORNITH_LES_FIXTURE_ROOT="$PWD/.test-fixtures"
          export TEST_RUNNER_ORNITH_LES_FIXTURE_ROOT="$ORNITH_LES_FIXTURE_ROOT"
          export GGUF_HEADER_FIXTURE="$PWD/.test-fixtures/ornith-tokenizer/qwen35-vocabulary-only.gguf"
          export TEST_RUNNER_GGUF_HEADER_FIXTURE="$GGUF_HEADER_FIXTURE"
          xcodebuild test -scheme minirun-Package -destination 'platform=macOS' \
            -only-testing:OrnithLESTests -only-testing:ModelAdaptersTests/CanonicalQwen35TokenizerParityTests \
            -only-testing:ModelAdaptersTests/QwenThinkingTextTests \
            -only-testing:MinirunRunnersTests/OrnithLESChatTests \
            -skipPackagePluginValidation -skipMacroValidation \
            > .work/les-swift-tests.log 2>&1
          tail -12 .work/les-swift-tests.log
          grep 'ORNITH_REAL_HEADER_MEMORY selectedExperts=8 requestedPrediction=4 adaptivePrediction=3 demandOnlyPrediction=0 insufficientDemandRejected=true metadataOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_PREPARATION_ADMISSION phaseCaptured=true beforeAndAfterCaptured=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_NATIVE_LIFETIME explicitClose=true wrapperStillAlive=true repeatedOwners=3 noLiveBuffers=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_CANONICAL_ROUTING completeBatchTrace=true partialRejected=true changedExpertRejected=true legacyPreserved=true' .work/les-swift-tests.log
          grep 'ORNITH_LAYER_CHECKPOINTS exactReplay=true bounded=true failClosed=true noPayload=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_DIAGNOSTIC_GATE originalFailurePreserved=true observedSuccessCannotAdmit=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_DEQUANTIZED_SWIFT explicitMode=true defaultUnchanged=true boundedScratch=true noPayload=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_ARITHMETIC_GATE independentReference=true originalDiscrepancyPreserved=true fullRoutingRequired=true callbackFreeRequired=true batchFallback=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_EXPERT_SET_GATE completeSetsRequired=true rankPermutationOnly=true predictionRankedTraceUnchanged=true strictLogits=true missingProofRejected=true batchFallback=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_CHAT_POLICY inProcessGate=true matchingModelAndRuntime=true exactPrefixOnly=true ordinaryEngineUnchanged=true syntheticOnly=true' .work/les-swift-tests.log
          grep 'ORNITH_CHAT_SAMPLING greedyIdentical=true logitsUnchanged=true thinkingBudgetOptIn=true fixtures=128 trainedInference=false' .work/les-swift-tests.log
          grep 'ORNITH_THINKING_BUDGET canonicalClosingTokens=true reasoningSeparated=true modelWeightsLoaded=false phoneInference=false' .work/les-swift-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ornith-les-controls
          include-hidden-files: true
          path: |
            .work/les-metal-projections.json
            .work/les-pooled-*.json
            .work/les-pooled-*.log
            .work/les-metal-projections.log
            .work/ornith-les-runtime/build.log
            .work/ornith-les-runtime/build-manifest.json
            .work/les-controls.log
            .work/les-allocation-controls.log
            .work/les-control-f32.json
            .work/les-mixed-controls.log
            .work/les-control-mixed.json
            .work/les-top8-controls.log
            .work/les-control-top8.json
            .work/les-reference-check.json
            .work/les-reference.log
            .work/les-swift-tests.log
            .work/les-real-header.json
            .work/les-real-header.log
            .work/ornith-thinking-tokenizer.log
          retention-days: 7
      - name: Export source-bound LES framework for full app validation
        uses: actions/upload-artifact@v4
        with:
          name: ornith-les-runtime
          include-hidden-files: true
          path: |
            .work/ornith-les-runtime/FlashOrnithLES.xcframework
            .work/ornith-les-runtime/build-manifest.json
          retention-days: 7
